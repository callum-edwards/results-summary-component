<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>

  <div class="card">
    <div class="score-section">
      <h2 class="score-section__title">Your Result</h2>

      <div class="score-circle">
        <div class="score">76</div>
        <p>of 100</p>
      </div>

      <h3 class="score-section__rank">Great</h3>
      <p class="score-section__fact">You scored higher than 65% of the people who have taken these tests.</p>
    </div>

    <div class="summary-section">
      <h2 class="summary-section__title">Summary</h2>
      
      <div class="stat-card stat-card--red">
        <img src="./assets/images/icon-reaction.svg" alt="Reaction Icon">
        <span class="stat-card__stat">Reaction</span>
        <p><span class="stat-card__score">80</span> / 100</p>
      </div>

      <div class="stat-card stat-card--yellow">
        <img src="./assets/images/icon-memory.svg" alt="Memory Icon">
        <span class="stat-card__stat">Memory</span>
        <p><span class="stat-card__score">80</span> / 100</p>
      </div>

      <div class="stat-card stat-card--green">
        <img src="./assets/images/icon-verbal.svg" alt="Verbal Icon">
        <span class="stat-card__stat">Verbal</span>
        <p><span class="stat-card__score">80</span> / 100</p>
      </div>

      <div class="stat-card stat-card--blue">
        <img src="./assets/images/icon-visual.svg" alt="Visual Icon">
        <span class="stat-card__stat">Visual</span>
        <p><span class="stat-card__score">80</span> / 100</p>
      </div>

      <button class="summary-section__button">Continue</button>
    </div>
  </div>
</body>
</html>
